worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Reuse TCP connections to the backends instead of opening one per request.
  # Requires proxy_http_version 1.1 and an empty Connection header (set below).
  upstream web {
    server web:8080;
    keepalive 32;
  }
  upstream view {
    server view:3000;
    keepalive 16;
  }

  keepalive_timeout 65s;
  keepalive_requests 1000;

  # Compress text responses only (JSON API, SvelteKit HTML/JS/CSS).
  # JPEG/RAW are already compressed, so gzipping them just burns CPU.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_redirect off;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Larger in-memory buffers so multi-MB image responses mostly stay in RAM
  # instead of spilling to a temp file on every request.
  proxy_buffer_size 16k;
  proxy_buffers 64 64k;
  proxy_busy_buffers_size 256k;

  server {
    listen 80;
    server_name localhost;

    location /app {
      proxy_pass http://web;

      # Uploads to /app/static are capped at 100MB by MyUploadSupport;
      # nginx's default 1MB would reject them with 413 first.
      client_max_body_size 100m;
      # Stream request bodies to the backend instead of spooling them to disk first.
      proxy_request_buffering off;
    }

    location / {
      proxy_pass http://view;
    }
  }
}
