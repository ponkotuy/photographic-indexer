name: 'Release'
on:
  release:
    types: [ published ]
jobs:
  release-app:
    name: Release docker image
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25.0.5.1+2' # Zulu 25.38.201; keep in sync with .tool-versions
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # `--server` runs the task in this process; sbt 2's thin client could reuse a server without VERSION.
          sbt --server "Docker / publish"
          docker tag ponkotuy/photographic-indexer:$VERSION ghcr.io/ponkotuy/photographic-indexer:$VERSION
          docker tag ponkotuy/photographic-indexer:latest ghcr.io/ponkotuy/photographic-indexer:latest
          docker push ghcr.io/ponkotuy/photographic-indexer:$VERSION
          docker push ghcr.io/ponkotuy/photographic-indexer:latest

  release-view:
    name: Publish view docker image
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: build
        working-directory: ./view/
        run: docker compose -f docker-compose.build.yml build

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish
        working-directory: ./view/
        run: |
          docker tag ponkotuy/photographic-indexer-view:latest ponkotuy/photographic-indexer-view:${GITHUB_REF##*/}
          docker push ponkotuy/photographic-indexer-view:${GITHUB_REF##*/}
          docker push ponkotuy/photographic-indexer-view:latest
          docker tag ponkotuy/photographic-indexer-view:latest ghcr.io/ponkotuy/photographic-indexer-view:${GITHUB_REF##*/}
          docker tag ponkotuy/photographic-indexer-view:latest ghcr.io/ponkotuy/photographic-indexer-view:latest
          docker push ghcr.io/ponkotuy/photographic-indexer-view:${GITHUB_REF##*/}
          docker push ghcr.io/ponkotuy/photographic-indexer-view:latest

  release-clip-server:
    name: Publish clip-server docker image
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: build
        working-directory: ./clip-server/
        run: docker compose -f docker-compose.build.yml build

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        working-directory: ./clip-server/
        run: |
          docker tag ponkotuy/clip-server:latest ponkotuy/clip-server:${GITHUB_REF##*/}
          docker push ponkotuy/clip-server:${GITHUB_REF##*/}
          docker push ponkotuy/clip-server:latest
          docker tag ponkotuy/clip-server:latest ghcr.io/ponkotuy/clip-server:${GITHUB_REF##*/}
          docker tag ponkotuy/clip-server:latest ghcr.io/ponkotuy/clip-server:latest
          docker push ghcr.io/ponkotuy/clip-server:${GITHUB_REF##*/}
          docker push ghcr.io/ponkotuy/clip-server:latest
