name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25.0.5.1+2' # Zulu 25.38.201; keep in sync with .tool-versions
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check scalafmt
        run: sbt scalafmtCheckAll

      - name: Run tests
        run: sbt testFull
